# Amplify custom headers for Pit Wall. Replace the three <...> hosts with your own, then:
#   aws amplify update-app --app-id <APP_ID> --custom-headers file://scripts/amplify-headers.yml
# and redeploy the site so the headers take effect.
customHeaders:
  - pattern: '**'
    headers:
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://<SEASON_API_HOST> https://<ASK_FUNCTION_URL_HOST> https://<COGNITO_DOMAIN_HOST>; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
      - key: Strict-Transport-Security
        value: 'max-age=31536000; includeSubDomains'
      - key: X-Content-Type-Options
        value: 'nosniff'
      - key: X-Frame-Options
        value: 'DENY'
      - key: Referrer-Policy
        value: 'strict-origin-when-cross-origin'
      - key: Permissions-Policy
        value: 'camera=(), microphone=(), geolocation=()'
